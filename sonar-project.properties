sonar.projectKey=tacitness_frame
sonar.projectName=frame
sonar.sourceEncoding=UTF-8
sonar.working.directory=out/sonar/.scannerwork

sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,dist/**,out/**,.git/**,img/**
sonar.test.inclusions=tests/**/*.py
sonar.externalIssuesReportPaths=out/sonar/frame-policy.json

# NASM is intentionally analyzed as text plus repository-owned external issues.
sonar.text.inclusions.activate=true
sonar.text.inclusions=**/*.asm,**/*.sh,**/*.yml,**/*.yaml,**/*.md,Makefile,Dockerfile

# Coverage is not fabricated. Add a condition only after instruction/branch
# instrumentation exists and can produce a trustworthy report.
sonar.coverage.exclusions=**/*
