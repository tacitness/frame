name: Public Security Hardening Specification
description: Plan non-sensitive hardening. Use a private advisory for exploitable vulnerabilities.
title: "[security] "
labels:
  - bug
  - security
  - p1
  - needs-triage
  - release:patch
body:
  - type: markdown
    attributes:
      value: |
        <!-- sdd-spec-version: 1.1 -->
        Stop and use a private security advisory if this form would disclose an exploit,
        credential, private system, or unpatched vulnerability.
  - type: textarea
    id: repository
    attributes:
      label: Repository & System Clarity
      placeholder: |
        Repository: tacitness/frame
        tsctl key: frame
        System/subdomain:
        Protocol/API authority:
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Assets, trust boundaries, and attacker capability
      placeholder: |
        Assets:
        Trusted/untrusted inputs:
        Local/remote capability:
        Required privileges:
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Existing System Audit
      description: Do not include exploit instructions for an unpatched vulnerability.
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Implementation Constraints
      placeholder: |
        Prevent:
        Detect:
        Contain/recover:
        Compatibility cost:
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Testing Strategy
      placeholder: |
        - [ ] Malformed/unauthorized input is rejected safely.
        - [ ] Other clients and server remain available.
        - [ ] Scanner and SonarQube gates pass.
        - [ ] Disclosure/rollout steps are recorded if applicable.
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Related Issues & Blockers
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure safety
      options:
        - label: This public issue does not expose a usable exploit, secret, or private infrastructure detail.
          required: true
