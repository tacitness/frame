name: Automatic SemVer tag

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: automatic-semver-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag validated main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden hosted runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the exact validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Derive release intent and push an immutable tag
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if git tag --points-at "$VALIDATED_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            echo "Validated commit is already tagged"
            exit 0
          fi

          last_tag="$(git tag --merged "$VALIDATED_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"
          if [[ -n "$last_tag" ]]; then
            range="$last_tag..$VALIDATED_SHA"
          else
            range="$VALIDATED_SHA^..$VALIDATED_SHA"
          fi
          messages="$(git log --format='%B' "$range")"

          if grep -Eq '(^|[[:space:]])BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!:' <<<"$messages"; then
            bump="major"
          elif grep -Eq '^feat(\([^)]*\))?:' <<<"$messages"; then
            bump="minor"
          elif grep -Eq '^(fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?:' <<<"$messages"; then
            bump="patch"
          else
            echo "No release-producing Conventional Commit found"
            exit 0
          fi

          tag="$(scripts/version.sh next "$bump")"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" "$VALIDATED_SHA" -m "Release $tag"
          git push origin "$tag"
          echo "Published $tag for $VALIDATED_SHA"
